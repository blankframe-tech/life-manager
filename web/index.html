<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!--
    Static files only: no server, no analytics, no third-party requests.
    'wasm-unsafe-eval' lets CanvasKit (served from this site) compile its
    WebAssembly; Flutter injects its own <style> rules, hence
    style-src 'unsafe-inline'. blob: is the picked file being read and the
    encrypted vault being downloaded (local object URLs, not network).
    See docs/WEB.md.
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open your encrypted Life Manager vault. Your data never leaves this browser except as the encrypted file you save.">
  <meta name="theme-color" content="#1F4D3A">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Life Manager">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Life Manager</title>
  <link rel="manifest" href="manifest.json">
  <style>body { background: #F7F3EA; margin: 0; } @media (prefers-color-scheme: dark) { body { background: #121814; } }</style>
</head>
<body>
  <script src="no_remote_scripts.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
